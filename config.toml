    [params.jobs]
        enable = true

        [[params.jobs.list]]
        position = "DevSecOps Engineer"
        dates = "Aug 2025 - May 2026"
        company = "Decyda SRLS"
        details = "• Engineered cloud security governance by deploying Cloud Custodian on AWS, writing custom Python-based policies to enforce compliance and auto-remediate risks.\n\n• Executed penetration testing on web applications, identifying critical vulnerabilities and partnering with developers to patch code before production deployment.\n\n• Deployed AI-based security guardrails within CI/CD pipelines, automatically blocking risky code changes and reducing manual code review time."

        [[params.jobs.list]]
        position = "IT Cybersecurity Specialist"
        dates = "Jul 2024 - Jul 2025"
        company = "Department of the Interior"
        details = "• Developed and integrated automated security scanning tools into Azure and GitHub pipelines, successfully detecting and mitigating 40+ critical vulnerabilities during the build phase.\n\n• Scripted automation for phishing analysis and document processing, which increased team efficiency by 60% and reduced mean time to respond (MTTR).\n\n• Programmed custom Splunk queries to correlate data sources, improving anomaly detection rates by 30% across the enterprise environment.\n\n• Conducted comprehensive identity audits and engineered stricter access controls (IAM) to harden the environment against unauthorized entry."

        [[params.jobs.list]]
        position = "IT/Cyber Security Auditor"
        dates = "January 2024 - July 2024"
        company = "United Services Automobile Association (USAA)"
        details = "• Developed comprehensive technical documentation for internal threat management controls and monitoring systems\n\n• Created detailed process maps identifying business partner workflows and technology integration points\n\n• Analyzed control effectiveness and identified opportunities for refinement and improvement\n\n• Collaborated with cross-functional teams to enhance security posture and threat detection capabilities"

        [[params.jobs.list]]
        position = "Systems Administrator"
        dates = "December 2022 - May 2023"
        company = "Piedmont Regional Council, Kernersville, NC"
        details = "• Developed and deployed custom Microsoft PowerApps solutions, automating business processes and creating data visualization dashboards\n\n• Managed Azure cloud infrastructure for 200+ users, including VM deployment, storage configuration, and network resource maintenance\n\n• Enhanced organizational productivity through streamlined workflows and improved decision-making capabilities\n\n• Implemented security best practices and ensured system scalability and reliability"

        [[params.jobs.list]]
        position = "Systems Administrator"
        dates = "December 2012 - December 2022"
        company = "Various locations in the US and overseas"
        details = "• Managed critical infrastructure including Windows systems, LAN networks, and cloud backup solutions\n\n• Supervised application maintenance and computing infrastructure activities ensuring 99.9% uptime\n\n• Provided technical support to 200+ employees across the United States with <2-hour response times\n\n• Implemented robust backup and disaster recovery procedures ensuring data resilience and availability\n\n• Provided Tier 1/2 technical support for over 500 personnel, resolving an average of 200+ helpdesk tickets monthly with a 87% satisfaction rating\n\n• Managed user accounts, permissions, and group policies within Active Directory to ensure compliance with strict Department of Defense (DoD) security protocols"

