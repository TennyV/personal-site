    # Summary section
    [params.summary]
        enable = true
        icon = "fa-user"
        title = "Professional Summary"
        summary = "I'm a security engineer who loves finding things that are broken before the bad guys do. My sweet spot is CI/CD pipelines — getting security to live inside the build process instead of bolted on at the end. I've done this at federal agencies, in finance, and now internationally at Decyda SRLS in Poland. When I'm not at a keyboard I'm tinkering with Raspberry Pis, because apparently I can't stop. Working toward my Master's in Information Security Engineering at SANS and hold eight GIAC certifications."

