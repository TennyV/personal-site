            <div class="certifications-container container-block">
                <h2 class="container-block-title">{{ i18n "certifications" }}</h2>
                <div class="certifications-grid">
                {{ range .Site.Params.certifications.list }}
                <div class="cert-card">
                    {{ if .badgeImage }}
                    <img class="cert-badge-image" src="{{ .badgeImage }}" alt="{{ .acronym }} badge" loading="lazy">
                    {{ else }}
                    <div class="cert-badge-placeholder">
                        <div class="giac-logo">
                            <div style="font-size:1rem;font-weight:800;">{{ .acronym }}</div>
                            <div style="font-size:0.6rem;margin-top:2px;opacity:0.85;">{{ .issuer }}</div>
                        </div>
                    </div>
                    {{ end }}
                    <div class="cert-details">
                        <h4 class="certification">{{ .name }}{{ if .honors }} <span style="color:#f39c12;font-size:0.72rem;">★ Honors</span>{{ end }}</h4>
                        <div class="meta">{{ .issuer }}</div>
                        <div class="time">{{ .date }}</div>
                    </div>
                </div>
                {{ end }}
                </div>
            </div><!--//certifications-container-->
